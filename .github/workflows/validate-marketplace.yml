name: Validate marketplace

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Manifest, paths, and duplicated guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json and every declared path
        run: |
          python3 - <<'PY'
          import json, os, sys

          errors = []
          warnings = []

          def check(path, label):
              if not os.path.exists(path):
                  errors.append(f"{label}: missing path {path!r}")
                  return False
              return True

          manifest_path = ".claude-plugin/marketplace.json"
          if not os.path.exists(manifest_path):
              print(f"FATAL: {manifest_path} not found")
              sys.exit(1)

          with open(manifest_path) as fh:
              try:
                  manifest = json.load(fh)
              except json.JSONDecodeError as exc:
                  print(f"FATAL: {manifest_path} is not valid JSON: {exc}")
                  sys.exit(1)

          for key in ("name", "owner", "metadata", "plugins"):
              if key not in manifest:
                  errors.append(f"marketplace.json: missing top-level key {key!r}")

          if not isinstance(manifest.get("plugins"), list) or not manifest["plugins"]:
              errors.append("marketplace.json: 'plugins' must be a non-empty array")
              manifest["plugins"] = []

          for plugin in manifest["plugins"]:
              name = plugin.get("name", "<unnamed>")
              for key in ("name", "description", "source", "version", "license"):
                  if key not in plugin:
                      errors.append(f"{name}: missing key {key!r}")

              source = plugin.get("source")
              if not source:
                  continue
              root = os.path.normpath(source)
              if not check(root, f"{name} source"):
                  continue

              # Declared component paths are relative to the plugin source.
              for key in ("skills", "commands"):
                  declared = plugin.get(key, [])
                  if not declared:
                      warnings.append(f"{name}: no {key} declared — none will load")
                  for rel in declared:
                      path = os.path.normpath(os.path.join(root, rel))
                      if check(path, f"{name} {key}"):
                          if key == "skills" and not os.path.isfile(os.path.join(path, "SKILL.md")):
                              errors.append(f"{name} skills: {path} has no SKILL.md")
                          if key == "commands" and not path.endswith(".md"):
                              errors.append(f"{name} commands: {path} is not a .md file")

              if "mcpServers" in plugin and isinstance(plugin["mcpServers"], str):
                  mcp = os.path.normpath(os.path.join(root, plugin["mcpServers"]))
                  if check(mcp, f"{name} mcpServers"):
                      with open(mcp) as fh:
                          try:
                              json.load(fh)
                          except json.JSONDecodeError as exc:
                              errors.append(f"{name} mcpServers: {mcp} is not valid JSON: {exc}")

              # Every file on disk should be declared. CI can't require it, but it can warn.
              for key, subdir, pred in (
                  ("commands", "commands", lambda p: p.endswith(".md")),
                  ("skills", "skills", os.path.isdir),
              ):
                  disk_dir = os.path.join(root, subdir)
                  if not os.path.isdir(disk_dir):
                      continue
                  declared = {
                      os.path.normpath(os.path.join(root, rel))
                      for rel in plugin.get(key, [])
                  }
                  for entry in sorted(os.listdir(disk_dir)):
                      candidate = os.path.join(disk_dir, entry)
                      if pred(candidate) and os.path.normpath(candidate) not in declared:
                          warnings.append(
                              f"{name}: {candidate} exists but is not declared in {key} — it will never load"
                          )

          for line in warnings:
              print(f"warning: {line}")
          for line in errors:
              print(f"error: {line}")

          if errors:
              sys.exit(1)
          print(f"OK: {len(manifest['plugins'])} plugin(s), all declared paths exist")
          PY

      - name: Check every SKILL.md has name and description frontmatter
        run: |
          python3 - <<'PY'
          import glob, sys

          errors = []
          for path in sorted(glob.glob("plugins/*/skills/*/SKILL.md")):
              with open(path) as fh:
                  text = fh.read()
              if not text.startswith("---\n"):
                  errors.append(f"{path}: no YAML frontmatter")
                  continue
              front = text.split("---\n", 2)[1]
              for key in ("name:", "description:"):
                  if key not in front:
                      errors.append(f"{path}: frontmatter missing {key}")

          for line in errors:
              print(f"error: {line}")
          sys.exit(1 if errors else 0)
          PY

      - name: Check commands list both MCP tool-name prefixes
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          errors = []
          for path in sorted(glob.glob("plugins/*/commands/*.md")):
              plugin = path.split(os.sep)[1]
              with open(path) as fh:
                  text = fh.read()
              match = re.search(r"^allowed-tools:(.*)$", text, re.MULTILINE)
              if not match:
                  errors.append(f"{path}: no allowed-tools in frontmatter")
                  continue
              tools = [t.strip() for t in match.group(1).split(",")]
              bare = {t for t in tools if t.startswith("mcp__") and not t.startswith("mcp__plugin_")}
              scoped = {t for t in tools if t.startswith("mcp__plugin_")}
              for tool in sorted(bare):
                  server_and_rest = tool[len("mcp__"):]
                  server, _, facade = server_and_rest.partition("__")
                  expected = f"mcp__plugin_{plugin}_{server}__{facade}"
                  if expected not in scoped:
                      errors.append(f"{path}: {tool} declared without its plugin-scoped twin {expected}")

          for line in errors:
              print(f"error: {line}")
          sys.exit(1 if errors else 0)
          PY

      - name: Check the duplicated Boundaries block is byte-identical everywhere
        run: |
          python3 - <<'PY'
          import glob, sys

          MARKER = "## Boundaries\n"
          blocks = {}
          for path in sorted(
              glob.glob("plugins/healthypress/skills/*/SKILL.md")
              + glob.glob("plugins/healthypress/commands/*.md")
          ):
              with open(path) as fh:
                  text = fh.read()
              if MARKER not in text:
                  print(f"error: {path}: missing the '## Boundaries' block (duplicated on purpose)")
                  blocks[path] = None
                  continue
              blocks[path] = MARKER + text.split(MARKER, 1)[1]

          missing = [p for p, b in blocks.items() if b is None]
          present = {p: b for p, b in blocks.items() if b is not None}

          distinct = {}
          for path, block in present.items():
              distinct.setdefault(block, []).append(path)

          if len(distinct) > 1:
              print("error: the Boundaries block is not byte-identical across files.")
              print("       It is duplicated on purpose — fix every copy, do not deduplicate.")
              for i, (_, paths) in enumerate(sorted(distinct.items(), key=lambda kv: -len(kv[1])), 1):
                  print(f"       variant {i}: {', '.join(paths)}")

          if missing or len(distinct) > 1:
              sys.exit(1)
          print(f"OK: Boundaries block identical across {len(present)} files")
          PY
